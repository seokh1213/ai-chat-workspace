apiVersion: v1
kind: Service
metadata:
  name: trip-plan-postgres
  namespace: dev
  labels:
    app.kubernetes.io/name: trip-plan-postgres
    app.kubernetes.io/part-of: trip-plan
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: trip-plan-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: trip-plan-postgres
  namespace: dev
  labels:
    app.kubernetes.io/name: trip-plan-postgres
    app.kubernetes.io/part-of: trip-plan
spec:
  serviceName: trip-plan-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: trip-plan-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trip-plan-postgres
        app.kubernetes.io/part-of: trip-plan
    spec:
      containers:
        - name: postgres
          image: mirror.gcr.io/library/postgres:18.6-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            # Postgres 18 lives in a new directory of the same volume; the 16 files beside it
            # are the rollback copy from the 2026-10-24 dump/restore upgrade.
            - name: PGDATA
              value: /var/lib/postgresql/data/pg18
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: trip-plan-secrets
                  key: postgres-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trip-plan-secrets
                  key: postgres-password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: trip-plan-secrets
                  key: postgres-db
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER"
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER"
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: run
          emptyDir:
            sizeLimit: 16Mi
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
